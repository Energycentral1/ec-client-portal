name: Sync Notion campaigns

# Pulls campaigns and deliverables from Notion into Supabase.
# Runs every night before the beehiiv and Zoom pulls, and by hand from the Actions tab.
on:
  schedule:
    - cron: "47 9 * * *"   # 4:47am ET
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:notion
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://kzaiplniicuuxhprrxxc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
