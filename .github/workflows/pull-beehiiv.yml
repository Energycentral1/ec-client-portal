name: Pull beehiiv and short.io

# Newsletter issues, newsletter ad numbers (beehiiv opens + short.io clicks) and paid email numbers, for every client.
# Numbers go in as pending; nothing reaches a client before it is approved in /admin/approvals.
on:
  schedule:
    - cron: "17 10 * * *"   # every day, 5:17am ET (after the Notion sync)
  workflow_dispatch:
    inputs:
      clients:
        description: Client slugs, space separated (empty = every client)
        required: false
      dry_run:
        description: Dry run (print what would be written, write nothing)
        type: boolean
        default: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pull:beehiiv -- ${{ inputs.dry_run && '--dry' || '' }} $CLIENTS
        env:
          CLIENTS: ${{ inputs.clients }}
          NEXT_PUBLIC_SUPABASE_URL: https://kzaiplniicuuxhprrxxc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
