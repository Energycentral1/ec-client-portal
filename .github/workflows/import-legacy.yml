name: Import legacy reports

# Loads data/legacy/*.json (numbers from the old Customer Report sheets) into Supabase (approved on arrival).
on:
  workflow_dispatch:
    inputs:
      client:
        description: Client slug, or several separated by commas (leave empty for all)
        required: false
      dry_run:
        description: Dry run (print what would be written, write nothing)
        type: boolean
        default: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:legacy -- ${{ inputs.dry_run && '--dry' || '' }} "$CLIENT"
        env:
          CLIENT: ${{ inputs.client }}
          NEXT_PUBLIC_SUPABASE_URL: https://kzaiplniicuuxhprrxxc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
